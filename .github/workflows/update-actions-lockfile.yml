name: Update Actions lockfile

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check workflow update token
        env:
          ACTIONS_LOCK_TOKEN: ${{ secrets.ACTIONS_LOCK_TOKEN }}
        run: |
          if [ -z "$ACTIONS_LOCK_TOKEN" ]; then
            echo "::error::Set the ACTIONS_LOCK_TOKEN repository secret to a token with Contents and Workflows write permissions (or repo and workflow scopes for a classic PAT)."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ACTIONS_LOCK_TOKEN }}
          persist-credentials: true
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock
      - name: Update and verify lockfile
        run: |
          gh actions-lock
          gh actions-lock --verify
      - name: Commit lockfile updates
        run: |
          if [ -z "$(git status --porcelain -- .github/workflows)" ]; then
            echo "Actions lockfile is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "chore: update Actions lockfile"
          git push
