name: Update Dependency Graph for SBT
on:
  push:
    branches:
      - main
  workflow_dispatch: 
jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: corretto
          java-version: '21'
      - uses: sbt/setup-sbt@v1.5.13
        with:
          sbt-runner-version: 1.12.11
      - id: submit
        uses: scalacenter/sbt-dependency-submission@v3.2.3
      - name: Log snapshot for user validation
        run: cat ${{ steps.submit.outputs.snapshot-json-path }} | jq
